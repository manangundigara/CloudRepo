
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Creative Website</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            background: linear-gradient(
                -45deg, #0f172a, #312e81, #6d28d9, #0f766e
            );
            background-size: 400% 400%;
            animation: gradient 12s ease infinite;
        }

        /* Animated background */
        @keyframes gradient {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating background circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.4;
            animation: float 7s ease-in-out infinite;
        }

        .circle-one {
            width: 220px;
            height: 220px;
            background: #a78bfa;
            top: 8%;
            left: 10%;
        }

        .circle-two {
            width: 300px;
            height: 300px;
            background: #22d3ee;
            bottom: 5%;
            right: 8%;
            animation-delay: -3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-35px) rotate(10deg); }
        }

        /* Main glass card */
        .container {
            position: relative;
            z-index: 1;
            width: min(90%, 650px);
            padding: 60px 35px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: appear 1s ease-out;
            transition: transform 0.4s, box-shadow 0.4s;
        }

        .container:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.35);
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tag {
            display: inline-block;
            padding: 8px 15px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            background: rgba(255,255,255,0.1);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(35px, 7vw, 58px);
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        h1 span {
            background: linear-gradient(90deg, #67e8f9, #c4b5fd, #f0abfc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        p {
            color: #e2e8f0;
            font-size: 17px;
            line-height: 1.8;
            max-width: 470px;
            margin: 0 auto 30px;
        }

        /* Glowing button */
        .btn {
            display: inline-block;
            padding: 14px 30px;
            border: none;
            border-radius: 50px;
            color: #111827;
            background: linear-gradient(90deg, #67e8f9, #c4b5fd);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(103, 232, 249, 0.25);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 35px rgba(196, 181, 253, 0.65);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: #cbd5e1;
            letter-spacing: 1px;
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            .container {
                padding: 45px 22px;
            }

            p {
                font-size: 15px;
            }

            .circle-one {
                width: 140px;
                height: 140px;
            }

            .circle-two {
                width: 180px;
                height: 180px;
            }
        }

        /* Respect reduced motion preferences */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="circle circle-one"></div>
    <div class="circle circle-two"></div>

    <main class="container">
        <div class="tag">✨ Welcome to my world</div>

        <h1>Build Something <span>Amazing.</span></h1>

        <p>
            Welcome to my creative space. Explore modern design,
            beautiful animations, and a little bit of magic with CSS.
        </p>

        <button class="btn" onclick="showMessage()">
            Get Started ↗
        </button>

        <div class="footer">
            DESIGNED WITH HTML & CSS ❤️
        </div>
    </main>

    <script>
        function showMessage() {
            alert("Welcome! Let's create something amazing.");
        }
    </script>

</body>
</html>
